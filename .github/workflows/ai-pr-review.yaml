---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: AI PR Review

on:
  pull_request:
    branches: ["main"]
    # `labeled` enables one-click re-review: add the `ai-review` label to
    # force a fresh review (only write/triage can label — self-authorizing).
    types: [opened, reopened, synchronize, ready_for_review, labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to (re-)review
        required: true

concurrency:
  # `labeled` events get their own group so auto-applied labels (e.g. Renovate)
  # don't cancel the in-flight opened review.
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}${{
      github.event.action == 'labeled' && format('-label-{0}', github.run_id) || ''
    }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review-pr:
    name: AI PR Review
    if: >-
      ${{ (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
          github.event_name == 'workflow_dispatch' }}
    runs-on: arc-runner-set-home-ops
    timeout-minutes: 30
    steps:
      - name: Resolve PR head for re-review
        id: prctx
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          echo "head_sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || steps.prctx.outputs.head_sha }}

      - name: Generate bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      # Lattice routes to the Mac's Ollama (10.0.1.248:11434) which flaps when
      # the Mac is asleep or rebooting. Poll until at least one model is available
      # before handing off to the reviewer action. Gives the node up to 5 minutes
      # to come back online before giving up.
      - name: Wait for Lattice models to be available
        run: |
          LATTICE_URL="http://lattice.ai.svc.cluster.local:8090/v1/models"
          TIMEOUT=300   # 5 minutes
          INTERVAL=15
          ELAPSED=0

          echo "Polling ${LATTICE_URL} for available models..."
          while true; do
            MODEL_COUNT=$(curl -sf --max-time 5 "${LATTICE_URL}" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); print(len(d.get('data', [])))" 2>/dev/null || echo "0")

            if [ "${MODEL_COUNT}" -gt 0 ] 2>/dev/null; then
              echo "Lattice is ready — ${MODEL_COUNT} model(s) available."
              break
            fi

            if [ "${ELAPSED}" -ge "${TIMEOUT}" ]; then
              echo "::warning::Lattice has no models available after ${TIMEOUT}s; proceeding anyway (reviewer will use on_model_failure=notice)."
              break
            fi

            echo "No models yet (${ELAPSED}s elapsed), retrying in ${INTERVAL}s..."
            sleep "${INTERVAL}"
            ELAPSED=$((ELAPSED + INTERVAL))
          done

      - name: Analyze PR with AI reviewer
        id: analyze
        uses: misospace/pr-reviewer-action@829f395f7154b4d87c229500fd09b30a8ad2224d # v3.3.0
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          pr_number: ${{ github.event.pull_request.number || inputs.pr_number }}
          force_review: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
          # --- AI model config (Lattice - internal cluster DNS) ---
          # qwen2.5-coder:7b has a 32k context window.
          # json_object enforces structured output so smaller models don't emit prose.
          ai_base_url: http://lattice.ai.svc.cluster.local:8090/v1
          ai_api_format: openai
          ai_model: qwen2.5-coder:7b
          ai_max_tokens: "16000"
          ai_response_format: json_object
          ai_primary_retries: "5"
          ai_primary_retry_delay_sec: "30"
          # --- Fallback model (deepseek-r1:14b has 131k context window) ---
          ai_fallback_base_url: http://lattice.ai.svc.cluster.local:8090/v1
          ai_fallback_api_format: openai
          ai_fallback_model: deepseek-r1:14b
          # --- Review settings ---
          context_limit_mode: normal
          ci_status_check: "true"
          ci_timeout_sec: "600"
          system_prompt_file: .github/pr-review-instructions.md
          system_prompt_mode: append
          standards_file_candidates: "AGENTS.md"
          on_model_failure: notice
          inline_findings: "true"
          publish_mode: review_comment

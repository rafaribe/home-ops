---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app homelable
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: homelable
  values:
    controllers:
      homelable:
        annotations:
          glance/description: Homelab Infrastructure Visualization
          glance/icon: mdi:lan
          glance/id: homelable
          glance/name: Homelable
          glance/url: https://homelable.rafaribe.com
          reloader.stakater.com/auto: "true"

        pod:
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
          nodeSelector:
            kubernetes.io/arch: amd64

        containers:
          # nginx SPA — the only port exposed to the route
          # nginx listens on port 80 inside the container (docker-compose maps 3000:80)
          frontend:
            image:
              repository: ghcr.io/pouzor/homelable-frontend
              tag: latest
            env:
              # Tell nginx where to proxy /api, /ws and docs to
              BACKEND_UPSTREAM: localhost:8000
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 80
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 80
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  failureThreshold: 3
            resources:
              requests:
                cpu: 10m
                memory: 64M
              limits:
                memory: 256M
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
                add:
                  # nginx needs CHOWN/SETUID/SETGID to set up cache dirs at startup
                  - CHOWN
                  - SETUID
                  - SETGID
              readOnlyRootFilesystem: false

          # FastAPI backend — internal only, no route needed
          backend:
            image:
              repository: ghcr.io/pouzor/homelable-backend
              tag: latest
            env:
              TZ: Europe/Lisbon
              SQLITE_PATH: /app/data/homelab.db
            envFrom:
              - secretRef:
                  name: *app
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: 8000
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: 8000
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  failureThreshold: 3
            resources:
              requests:
                cpu: 50m
                memory: 128M
              limits:
                memory: 512M
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
                add:
                  # Required for ICMP ping-based node health checks
                  - NET_RAW
              readOnlyRootFilesystem: false
              runAsUser: 0

    service:
      app:
        controller: *app
        ports:
          http:
            port: &port 80

    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Homelable
          gethomepage.dev/icon: mdi-lan
          gethomepage.dev/group: Infrastructure
          gethomepage.dev/href: https://homelable.rafaribe.com
          gethomepage.dev/description: Homelab Visualization

        hostnames: ["homelable.rafaribe.com"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *port

    persistence:
      data:
        existingClaim: *app
        advancedMounts:
          homelable:
            backend:
              - path: /app/data

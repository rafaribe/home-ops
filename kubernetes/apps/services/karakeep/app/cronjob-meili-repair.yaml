---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/rbac.authorization.k8s.io/serviceaccount_v1.json
apiVersion: v1
kind: ServiceAccount
metadata:
  name: karakeep-meili-repair
  namespace: services
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/rbac.authorization.k8s.io/role_v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: karakeep-meili-repair
  namespace: services
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete", "get", "list"]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "patch"]
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/rbac.authorization.k8s.io/rolebinding_v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: karakeep-meili-repair
  namespace: services
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: karakeep-meili-repair
subjects:
  - kind: ServiceAccount
    name: karakeep-meili-repair
    namespace: services
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/batch/cronjob_v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: karakeep-meili-repair
  namespace: services
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: repair
              image: docker.io/bitnami/kubectl:latest@sha256:f7f9e4f64d9e114650c115a4ac6fd383394b3d494061a8f17b1a0f6c8d55bc25
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail

                  echo "Checking meilisearch container status in karakeep pod..."

                  POD=$(kubectl get pod -n services \
                    -l app.kubernetes.io/name=karakeep \
                    -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)

                  if [ -z "$POD" ]; then
                    echo "No karakeep pod found, exiting."
                    exit 0
                  fi

                  # Check if the meilisearch container specifically is in CrashLoopBackOff
                  STATE=$(kubectl get pod -n services "$POD" \
                    -o jsonpath='{.status.containerStatuses[?(@.name=="meilisearch")].state.waiting.reason}' \
                    2>/dev/null || true)

                  if [ "$STATE" != "CrashLoopBackOff" ]; then
                    echo "meilisearch container is not in CrashLoopBackOff (state: '${STATE:-running/ok}'), nothing to do."
                    exit 0
                  fi

                  echo "meilisearch is in CrashLoopBackOff — wiping /meili_data from mounted PVC..."
                  find /meili_data -mindepth 1 -delete
                  echo "meili_data wiped."

                  echo "Deleting karakeep pod $POD to trigger restart..."
                  kubectl delete pod -n services "$POD"
                  echo "Pod deleted, Kubernetes will restart it shortly."

                  echo "Annotating HelmRelease to trigger Flux reconciliation..."
                  kubectl annotate helmrelease karakeep -n services \
                    reconcile.fluxcd.io/requestedAt="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                    --overwrite
                  echo "Done."
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
              volumeMounts:
                - mountPath: /meili_data
                  name: config
                  subPath: meilisearch
          restartPolicy: OnFailure
          securityContext:
            fsGroup: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          serviceAccountName: karakeep-meili-repair
          volumes:
            - name: config
              persistentVolumeClaim:
                claimName: karakeep
  schedule: "*/10 * * * *"
  successfulJobsHistoryLimit: 1

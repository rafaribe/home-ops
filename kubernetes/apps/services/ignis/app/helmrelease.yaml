---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app ignis
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      ignis:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: Recreate
        initContainers:
          clear-obsidian-app:
            image:
              repository: docker.io/library/busybox
              tag: 1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
            command:
              - /bin/sh
              - -c
              - "rm -rf /app/obsidian-app/* /app/obsidian-app/.* 2>/dev/null; chmod -R 777 /app/obsidian-app; true"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              runAsUser: 0
        containers:
          app:
            image:
              repository: docker.io/nobbe/ignis
              tag: 0.8.11@sha256:163f1cd0ec98c997df8548dc2e12dfc53877fb52a104e1c4ab959677b7b8892b
            env:
              OBSIDIAN_VERSION: "1.12.7"
              PGID: "1000"
              PORT: "8080"
              PUID: "1000"
              TZ: Europe/Lisbon
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 8080
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: true
              capabilities:
                add:
                  - CHOWN
                  - FOWNER
                  - SETUID
                  - SETGID
                drop:
                  - ALL
              readOnlyRootFilesystem: false
              runAsUser: 0
    defaultPodOptions:
      securityContext:
        runAsNonRoot: false
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    route:
      app:
        hostnames: ["obsidian.rafaribe.com"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *port
    persistence:
      data:
        existingClaim: *app
        globalMounts:
          - path: /app/data
            subPath: data
          - path: /app/obsidian-app
            subPath: obsidian-app
      vaults:
        type: nfs
        server: truenas.rafaribe.com
        path: /mnt/storage-0/syncthing/obsidian
        globalMounts:
          - path: /vaults

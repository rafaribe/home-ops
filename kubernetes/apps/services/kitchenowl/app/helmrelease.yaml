---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app kitchenowl
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: kitchenowl
  values:
    defaultPodOptions:
      nodeSelector:
        kubernetes.io/arch: amd64
    controllers:
      kitchenowl:
        annotations:
          reloader.stakater.com/auto: "true"

        pod:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: "OnRootMismatch"

        initContainers:
          chown-data:
            image:
              repository: ghcr.io/home-operations/busybox
              tag: 1.38@sha256:ff88728f0d5fe50a9984f6cc04d7d1185590b628f29ef4e6a3ec8cae7169e0c8
            command: ["sh", "-c", "chown -R 1000:1000 /data"]
            securityContext:
              runAsUser: 0
              runAsGroup: 0
        containers:
          app:
            image:
              repository: ghcr.io/ahinko/kitchenowl
              tag: v0.7.4
            env:
              TZ: Europe/Lisbon
              COLLECT_METRICS: false
              EMAIL_MANDATORY: false
              FRONT_URL: https://kitchenowl.rafaribe.com
              OPEN_REGISTRATION: false
              SMTP_PORT: 25
              SMTP_HOST: smtp-relay-noreply.services.svc.cluster.local
              SMTP_FROM: noreply@rafaribe.com
              STORAGE_PATH: "/data"
            envFrom: &envFrom
              - secretRef:
                  name: *app
              - secretRef:
                  name: kitchenowl-kanidm-oauth2-credentials
                  optional: true
            resources:
              requests:
                cpu: 10m
                memory: 100Mi
              limits:
                memory: 768Mi
    service:
      app:
        controller: *app
        ports:
          http:
            port: &port 8080

    route:
      app:
        hostnames: ["{{ .Release.Name }}.rafaribe.com"]
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port

    persistence:
      data:
        type: persistentVolumeClaim
        existingClaim: kitchenowl-data
        globalMounts:
          - path: /data
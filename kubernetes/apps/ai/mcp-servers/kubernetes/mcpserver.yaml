---
# yaml-language-server: $schema=https://ks.hsn.dev/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: kubernetes-mcp
spec:
  args:
    - --config=/etc/kubernetes-mcp/config.toml
  groupRef:
    name: mcp-tools
  image: ghcr.io/containers/kubernetes-mcp-server:latest
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          volumeMounts:
            - mountPath: /tmp
              name: tmpfs
            - mountPath: /etc/kubernetes-mcp
              name: config
      volumes:
        - name: tmpfs
          emptyDir:
            medium: Memory
        - name: config
          configMap:
            name: kubernetes-mcp-config
  proxyPort: 8080
  transport: streamable-http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubernetes-mcp-config
data:
  config.toml: |
    port = "8080"
    read_only = true
    stateless = true

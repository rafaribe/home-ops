---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: truenas
  annotations:
    kopiur.home-operations.com/allow-identity-change: "intentional"
    kopiur.home-operations.com/allow-mass-deletion: "2026-09-19T18:39:30+00:00"
spec:
  allowedNamespaces:
    all: true
  backend:
    filesystem:
      path: /repository
      volume:
        nfs:
          path: /mnt/tank/volsync-kopia
          server: truenas.rafaribe.com
  bootstrap:
    failurePolicy:
      activeDeadlineSeconds: 43200
  catalog:
    fallbackNamespace: kopiur-system
    periodicRefresh: true
    refreshInterval: 1h
    retain:
      maxAgeDays: 90
      perIdentity: 100
  create:
    enabled: false
  credentialProjection:
    allowed: true
  encryption:
    passwordSecretRef:
      key: KOPIA_PASSWORD
      name: kopiur-repository-secret
      namespace: kopiur-system
  identityDefaults:
    hostnameExpr: namespace
    usernameExpr: policyName
  maintenance:
    enabled: true
    namespace: kopiur-system
    schedule:
      full:
        cron: "0 3 * * *"
        jitter: 1h
      quick:
        cron: "0 */6 * * *"
        jitter: 30m
    takeoverPolicy: Force
  mode: ReadWrite
  moverDefaults:
    podSecurityContext:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
      runAsGroup: 1000
      runAsUser: 1000
  onNamespaceDelete: Orphan
  parameters:
    epoch:
      # Lower from 24h default so maintenance compacts blobs more frequently.
      # With ~85 hourly snapshot schedules, 24h produces thousands of index blobs.
      # 6h keeps the count manageable while still batching compaction.
      minDuration: 6h
      # Trigger a new epoch after 5 new blobs instead of 20, preventing accumulation.
      advanceOnCount: 5
  scheduleDefaults:
    timezone: Europe/Lisbon

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: goldilocks
spec:
  chartRef:
    kind: OCIRepository
    name: goldilocks
  interval: 1h
  values:
    dashboard:
      enabled: true
    metrics-server:
      enabled: false
    vpa:
      enabled: false

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app stash
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  install:
    disableWait: true
  upgrade:
    disableWait: true
  values:
    controllers:
      stash:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/stash
              tag: 0.31.1@sha256:02b392ddaffccd6f7bcafb01b1810248c5a5a019f3dc8ac1aeed6d5c22ab7210
            env:
              STASH_CACHE: /data/cache/
              STASH_GENERATED: /data/generated/
              STASH_METADATA: /data/metadata/
              STASH_STASH: /media/
              TZ: Europe/Lisbon
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 9999
                  periodSeconds: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  periodSeconds: 10
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              readOnlyRootFilesystem: false
          uploader:
            image:
              repository: docker.io/gtstef/filebrowser
              tag: 2.0.2-stable-slim@sha256:ecc189364da3952e4117a889dd9c3b08405f54af22e5437973db6c3de8b95f7e
            env:
              FILEBROWSER_CONFIG: /config/config.yaml
            probes:
              liveness: &uploader-probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &uploader-port 80
                  periodSeconds: 10
              readiness: *uploader-probes
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              readOnlyRootFilesystem: false
    configMaps:
      uploader-config:
        data:
          config.yaml: |
            auth:
              methods:
                noauth: true
            server:
              cacheDir: /home/filebrowser/data/cache
              sources:
                - path: /media
                  config:
                    defaultEnabled: true
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
      uploader:
        controller: *app
        ports:
          http:
            port: *uploader-port
    route:
      app:
        hostnames: ["stash.rafaribe.com"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: http
      uploader:
        hostnames: ["stash-upload.rafaribe.com"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: uploader
                port: http
    persistence:
      config:
        existingClaim: *app
        globalMounts:
          - path: /.stash
      data:
        type: emptyDir
        globalMounts:
          - path: /data
      filebrowser-config:
        type: configMap
        identifier: uploader-config
        advancedMounts:
          stash:
            uploader:
              - path: /config/config.yaml
                subPath: config.yaml
                readOnly: true
      filebrowser-data:
        type: emptyDir
        advancedMounts:
          stash:
            uploader:
              - path: /home/filebrowser/data
      media:
        type: nfs
        server: truenas.rafaribe.com
        path: /mnt/storage-0/porn
        globalMounts:
          - path: /media
